name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Rapid pushes to a PR cancel the stale run. Pushes to main are never
# cancelled, so a green main always means that exact commit passed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three independent jobs run in parallel, and `Check` gathers them into the one
# status a branch ruleset can require. Every step is a `just` recipe run in the
# lean `ci` dev shell, and between them the jobs run every `just check` recipe,
# so a red run names the stage that failed. A recipe added to `check` must be
# added to one of these jobs too. See docs/adr/0001 and docs/adr/0002.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix

      # Realises the `ci` dev shell, so its one-off cost is not billed to the
      # first lint step. The linters need no cabal, so no Hackage index.
      - name: ❄️ Toolchain
        run: nix develop .#ci --accept-flake-config -c true

      - name: 🔤 Spell check
        run: nix develop .#ci --accept-flake-config -c just typos

      - name: 🎨 Format check
        run: nix develop .#ci --accept-flake-config -c just fmt-check

      - name: ❄️ Nix lint
        run: nix develop .#ci --accept-flake-config -c just check-nix

      - name: 🔍 Lint
        run: nix develop .#ci --accept-flake-config -c just lint

      - name: 🔍 Lint workflows
        run: nix develop .#ci --accept-flake-config -c just lint-actions

      - name: 🧭 Architecture
        run: nix develop .#ci --accept-flake-config -c just deslop

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix

      - name: 📦 Toolchain and cabal store
        uses: ./.github/actions/cabal-store
        with:
          name: build-test

      - name: 🏗️ Build
        run: nix develop .#ci --accept-flake-config -c just build

      - name: ❄️ Nix package
        run: nix develop .#ci --accept-flake-config -c just build-nix

      - name: 🧪 Test
        run: nix develop .#ci --accept-flake-config -c just test

  # Compiled so it cannot rot, never run: see docs/adr/0004. A job of its own
  # because it is the longest single compile, with its own store key because
  # its dependencies differ.
  bench:
    name: Benchmark
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix

      - name: 📦 Toolchain and cabal store
        uses: ./.github/actions/cabal-store
        with:
          name: bench

      - name: ⏱️ Build benchmark
        run: nix develop .#ci --accept-flake-config -c just build-bench

  # The status check to require: green only when every job above succeeded.
  # `always()` makes it report even when one failed or was skipped, because a
  # required check that never reports blocks the merge without saying why.
  check:
    name: Check
    needs: [lint, build-test, bench]
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions: {}
    steps:
      - name: ✅ Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job ended '$result'."
              exit 1
            fi
          done
