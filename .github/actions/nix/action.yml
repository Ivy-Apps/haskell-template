name: Nix
description: >-
  Installs Nix and backs its store with the GitHub Actions cache. Every job
  runs this first, after checking out the repository that holds it.

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        # This org is not on FlakeHub; without this the action logs a red
        # (non-fatal) auth error. The GitHub Actions cache does the work.
        use-flakehub: false
