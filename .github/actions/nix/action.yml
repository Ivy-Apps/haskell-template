name: Nix
description: >-
  Installs Nix and backs its store with the GitHub Actions cache. Every job
  runs this first, after checking out the repository that holds it.

runs:
  using: composite
  steps:
    # These two follow `main`, not a release, so the comment names the branch.
    - uses: DeterminateSystems/nix-installer-action@9383ce2bf08796b65508822f5982f49151badc4e # main
    - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc # main
      with:
        # This org is not on FlakeHub; without this the action logs a red
        # (non-fatal) auth error. The GitHub Actions cache does the work.
        use-flakehub: false
